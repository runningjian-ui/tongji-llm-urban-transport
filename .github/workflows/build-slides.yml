name: 编译 Slidev 课件

on:
  push:
    branches: [main]
    paths:
      - 'lectures/**/slides/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lecture:
          - 01-introduction
          # 后续添加更多讲次
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build slides for ${{ matrix.lecture }}
        run: |
          cd lectures/${{ matrix.lecture }}/slides
          npx slidev build slides.md --base /tongji-llm-urban-transport/slides/${{ matrix.lecture }}/ --out ../../../dist/slides/${{ matrix.lecture }}

      - name: Upload slides artifact
        uses: actions/upload-artifact@v4
        with:
          name: slides-${{ matrix.lecture }}
          path: dist/slides/${{ matrix.lecture }}
